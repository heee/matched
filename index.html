<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matched</title>
<meta name="description" content="Mahjong solitaire for two to eight.">
<meta name="theme-color" content="#0f2a20">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css?v=56">
<script src="./config.js"></script>
</head>
<body>
<div id="app">
  <main id="screen-root"></main>
</div>
<!-- Keep fixed navigation outside the scrolling app shell. Mobile Safari can
     otherwise position it against that ancestor instead of the viewport. -->
<nav class="tab-bar" id="tab-bar"></nav>
<div class="a11y-announcer" id="a11y-announcer" role="status" aria-live="polite"></div>
<script type="module" src="./app.js?v=85"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
    // A new SW activates (skipWaiting + clients.claim in sw.js) without
    // reloading already-open clients, so a shipped fix can sit inert in an
    // already-running PWA session indefinitely — reload once control
    // actually changes hands so it takes effect.
    let refreshedOnce = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (refreshedOnce) return;
      refreshedOnce = true;
      window.location.reload();
    });
  }
</script>
</body>
</html>
